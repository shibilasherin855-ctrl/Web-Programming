<!DOCTYPE HTML>
<html>
<head>
<title>Striped Table</title>
<style>
#studentTable {
width: 100%;
font-family: sans-serif;
border-collapse: collapse;
}
#studentTable th {
padding-top: 20px;
padding-bottom: 20px;
text-align:left;
color:white;
background-color: #b22222;
color:white;
border:1px solid grey;
}
#studentTable td{
padding: 8px;
border: 1px solid grey;
}
#studentTable tr:nth-child(odd) {
background-color: #f2f2f2;
}
#studentTable tr:nth-child(odd):hover{
background-color: burlywood;
}
</style>
</head>

<table id="studentTable">
<tr>
