<!DOCTYPE HTML>
<html>
<head>
<title>Image Alignment</title>
<style>
 h2 {
 background-color: red;
 color: white;
 text-align: left;
 }
 img {
 display: block;
 margin: auto;
 width: 200px;
 height: 150px;
 }
</style>
</head>
<body>
<h2> Center Image</h2>
<img src="paris.jpeg" alt="Eiffel Tower">
<h2>Eiffel Tower</h2>
</body>
</html>
